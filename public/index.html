<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07140f">
<title>21</title>
<style>
:root {
  --gold:#f6c85f; --gold-d:#e0a526; --ink:#f7f3e8; --dim:rgba(247,243,232,.65);
  --cw: clamp(46px, min(16vw, 11vh), 92px); --ch: calc(var(--cw) * 1.45);
  --ease: cubic-bezier(.2,.8,.2,1);
  --serif: Georgia, "Times New Roman", serif;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; height:100%; background:#07140f; color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; overflow:hidden; }
button, input { font:inherit; }
.hide { display:none !important; }
#app { position:fixed; inset:0; }

/* ---------- background ---------- */
.bg { position:absolute; inset:0; overflow:hidden; background:radial-gradient(ellipse at 50% 20%, #12664a 0%, #0a3a2b 45%, #05150f 100%); }
.orb { position:absolute; border-radius:50%; filter:blur(70px); opacity:.5; animation:orb 18s ease-in-out infinite alternate; }
.orb.a { width:46vmax; height:46vmax; left:-12vmax; top:-14vmax; background:#1ea36f; }
.orb.b { width:38vmax; height:38vmax; right:-10vmax; bottom:-12vmax; background:#c8891f; animation-duration:23s; opacity:.35; }
.orb.c { width:30vmax; height:30vmax; left:40%; top:50%; background:#2a4fd0; animation-duration:27s; opacity:.22; }
@keyframes orb { to { transform:translate(9vmax,6vmax) scale(1.2); } }

/* ---------- pages ---------- */
.page { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; overflow:auto;
        opacity:0; visibility:hidden; transform:scale(.97); transition:opacity .5s var(--ease), transform .5s var(--ease), visibility 0s .5s; }
#app.boot .page { transition:none !important; }
.page.active { opacity:1; visibility:visible; transform:none; transition-delay:0s; }

/* ---------- buttons / inputs ---------- */
.btn { border:0; cursor:pointer; font-weight:800; letter-spacing:.06em; padding:14px 28px; border-radius:999px; color:#2a1a05; position:relative; overflow:hidden;
       background:linear-gradient(180deg,#ffe08c,#e8a92b); box-shadow:0 6px 0 #a8741a, 0 14px 26px rgba(0,0,0,.4); transition:transform .12s, box-shadow .12s, filter .25s; }
.btn:hover:not(:disabled) { transform:translateY(-2px); }
.btn:active:not(:disabled) { transform:translateY(4px); box-shadow:0 2px 0 #a8741a, 0 4px 10px rgba(0,0,0,.4); }
.btn:disabled { filter:grayscale(.85) brightness(.65); cursor:not-allowed; }
.btn.ghost { background:rgba(255,255,255,.07); color:var(--ink); box-shadow:inset 0 0 0 2px rgba(255,255,255,.28); backdrop-filter:blur(6px); }
.btn.ghost:active:not(:disabled) { box-shadow:inset 0 0 0 2px rgba(255,255,255,.28); }
.btn.sm { padding:8px 16px; font-size:13px; box-shadow:inset 0 0 0 2px rgba(255,255,255,.28); }
.btn.big { font-size:18px; padding:16px 34px; min-width:140px; }
.btn.shine::after { content:""; position:absolute; top:0; left:-60%; width:40%; height:100%; background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent); transform:skewX(-20deg); animation:shine 3s infinite; }
@keyframes shine { 0%,55% { left:-60%; } 100% { left:140%; } }
.linkbtn { background:none; border:0; color:var(--dim); text-decoration:underline; cursor:pointer; margin-top:6px; }
.linkbtn:hover { color:var(--ink); }
.textin { width:min(340px,86vw); padding:16px 20px; font-size:22px; text-align:center; color:#fff; background:rgba(0,0,0,.35); border:2px solid rgba(255,255,255,.2); border-radius:16px; outline:none; transition:.25s; }
.textin:focus { border-color:var(--gold); box-shadow:0 0 0 5px rgba(246,200,95,.2), 0 0 30px rgba(246,200,95,.25); }
.err { min-height:22px; color:#ffb4b4; font-size:14px; margin-top:12px; text-align:center; }
.shake { animation:shake .45s; }
@keyframes shake { 20%,60% { transform:translateX(-9px); } 40%,80% { transform:translateX(9px); } }
#mute { position:fixed; top:14px; right:14px; z-index:60; width:40px; height:40px; border-radius:50%; border:0; cursor:pointer; background:rgba(0,0,0,.35); color:var(--ink); font-size:18px; backdrop-filter:blur(6px); }

/* ---------- playing cards ---------- */
.pc { position:relative; width:var(--cw); height:var(--ch); perspective:700px; flex:none; --c:#222; }
.pc .inner { position:absolute; inset:0; transform-style:preserve-3d; transition:transform .7s var(--ease); }
.pc.up .inner { transform:rotateY(180deg); }
.face { position:absolute; inset:0; border-radius:calc(var(--cw) * .12); backface-visibility:hidden; -webkit-backface-visibility:hidden; box-shadow:0 6px 14px rgba(0,0,0,.45); overflow:hidden; }
.face.front { transform:rotateY(180deg); background:linear-gradient(155deg,#fffef9 0%,#f2ead3 100%); color:var(--c); }
.face.front::before { content:""; position:absolute; inset:7%; border-radius:calc(var(--cw) * .08); border:1.5px solid currentColor; opacity:.25; }
.face.front::after { content:""; position:absolute; left:50%; top:50%; width:62%; aspect-ratio:1; transform:translate(-50%,-50%); border-radius:50%; background:currentColor; opacity:.09; }
.cn { position:absolute; font-family:var(--serif); font-weight:700; line-height:1; }
.cn.mid { left:0; right:0; top:50%; transform:translateY(-52%); text-align:center; font-size:calc(var(--cw) * .56); z-index:1; }
.cn.tl { left:12%; top:7%; font-size:calc(var(--cw) * .19); }
.cn.br { right:12%; bottom:7%; font-size:calc(var(--cw) * .19); transform:rotate(180deg); }
.face.back { background:repeating-linear-gradient(45deg,#233b86 0 5px,#1a2d6b 5px 10px); border:calc(var(--cw) * .06) solid #fffef9; }
.face.back::before { content:""; position:absolute; inset:5%; border:1.5px solid rgba(246,200,95,.8); border-radius:calc(var(--cw) * .07); }
.face.back::after { content:"21"; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:52%; aspect-ratio:1; display:grid; place-items:center; border-radius:50%;
  background:radial-gradient(circle,#15245a,#0c1840); border:1.5px solid var(--gold); color:var(--gold); font:700 calc(var(--cw) * .22) var(--serif); }

/* ================= LANDING ================= */
#landing { overflow:hidden; }
.fl { position:absolute; bottom:-30%; animation:rise var(--d) linear infinite; animation-delay:var(--dl); opacity:var(--o); filter:blur(var(--bl)); pointer-events:none; }
@keyframes rise { from { transform:translate(0,0) rotate(var(--r0)); } 50% { transform:translate(var(--sw),-65vh) rotate(calc((var(--r0) + var(--r1)) / 2)); } to { transform:translate(0,-135vh) rotate(var(--r1)); } }
.stack { position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; width:100%; max-width:520px; }
.hero { position:relative; width:min(360px,90vw); height:min(280px,52vw); margin-bottom:6px; --mx:0; --my:0; }
.hc { position:absolute; top:6%; left:50%; --cw:clamp(96px,26vw,138px); }
.hc.l { transform:translate(calc(-50% - 62px + var(--mx) * -14px), calc(var(--my) * -8px)) rotate(-14deg); }
.hc.r { transform:translate(calc(-50% + 62px + var(--mx) * -14px), calc(var(--my) * -8px)) rotate(14deg); }
.hc .bob { animation:bob 5s ease-in-out infinite; }
.hc.r .bob { animation-delay:-2.5s; }
.hc .pc { animation:heroIn 1s var(--ease) both; }
.hc.r .pc { animation-delay:.18s; }
@keyframes bob { 50% { transform:translateY(-12px); } }
@keyframes heroIn { from { transform:translateY(120%) rotate(40deg) scale(.6); opacity:0; } }
.title { position:absolute; inset:0; display:grid; place-items:center; font:900 clamp(120px,34vw,200px)/1 var(--serif); z-index:3; pointer-events:none;
  background:linear-gradient(100deg,#fff1bd 0%,#f6c85f 30%,#c9871a 50%,#f6c85f 70%,#fff1bd 100%); background-size:250% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 6px 0 #7a4f08) drop-shadow(0 18px 24px rgba(0,0,0,.55)); animation:titleIn 1s .35s var(--ease) both, sheen 5s 1.4s linear infinite; }
@keyframes titleIn { from { transform:scale(.4); opacity:0; } 60% { transform:scale(1.08); } }
@keyframes sheen { to { background-position:-250% 0; } }
.tag { color:var(--dim); font-size:clamp(14px,3.6vw,17px); margin:6px 0 30px; text-align:center; animation:fadeUp .8s .9s var(--ease) both; }
@keyframes fadeUp { from { opacity:0; transform:translateY(14px); } }
.steps { display:grid; width:100%; justify-items:center; min-height:190px; }
.step { grid-area:1/1; display:flex; flex-direction:column; align-items:center; width:100%; opacity:0; visibility:hidden; transform:translateY(18px) scale(.97); transition:opacity .4s var(--ease), transform .4s var(--ease), visibility 0s .4s; }
.step.on { opacity:1; visibility:visible; transform:none; transition-delay:0s; }
#s-play .btn { animation:fadeUp .8s 1.1s var(--ease) both, glow 2.2s 2s ease-in-out infinite; font-size:24px; padding:18px 64px; }
@keyframes glow { 50% { box-shadow:0 6px 0 #a8741a, 0 0 46px rgba(246,200,95,.75); } }
.q { font:700 24px var(--serif); margin-bottom:16px; text-align:center; }
.modes { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
.modes .btn { min-width:150px; font-size:18px; }
.hello { font:700 26px var(--serif); margin-bottom:20px; text-align:center; }
.hello b { color:var(--gold); }

/* ================= LOBBY ================= */
#lobby .panel { width:min(460px,100%); text-align:center; }
.cap { color:var(--dim); font-size:14px; letter-spacing:.14em; text-transform:uppercase; margin-bottom:14px; }
.digits, .tiles { display:flex; gap:clamp(6px,2vw,12px); justify-content:center; }
.digit, .tile { width:clamp(40px,12vw,58px); height:clamp(54px,16vw,76px); border-radius:14px; display:grid; place-items:center; font:700 clamp(26px,8vw,38px) var(--serif); }
.digit { border:2px solid rgba(255,255,255,.22); background:rgba(0,0,0,.35); color:#fff; text-align:center; padding:0; outline:none; transition:.2s; }
.digit:focus { border-color:var(--gold); box-shadow:0 0 0 4px rgba(246,200,95,.22); transform:translateY(-3px); }
.tile { background:linear-gradient(160deg,#fffef9,#eadfbf); color:#1d2b24; box-shadow:0 5px 0 #b9a977, 0 14px 22px rgba(0,0,0,.4); animation:tileIn .7s var(--ease) both; }
@keyframes tileIn { from { transform:perspective(400px) rotateX(-90deg) translateY(-20px); opacity:0; } }
.codewrap { cursor:pointer; }
.hint { color:var(--dim); font-size:13px; margin-top:14px; }
.seats { display:flex; gap:14px; justify-content:center; margin:30px 0 24px; }
.seat { flex:1; max-width:190px; padding:16px 10px; border-radius:18px; background:rgba(0,0,0,.28); border:1px solid rgba(255,255,255,.1); display:flex; flex-direction:column; align-items:center; gap:10px; }
.seat.in { animation:seatIn .6s var(--ease) both; border-color:rgba(246,200,95,.45); }
@keyframes seatIn { from { transform:scale(.6); opacity:0; } 60% { transform:scale(1.06); } }
.avatar { width:48px; height:48px; border-radius:50%; display:grid; place-items:center; font:800 22px var(--serif); background:linear-gradient(135deg,#ffd878,#e2743c); color:#2a1a05; box-shadow:0 4px 10px rgba(0,0,0,.4); }
.avatar.ghostav { background:rgba(255,255,255,.08); box-shadow:none; }
.sname { font-weight:700; font-size:15px; word-break:break-word; }
.seat.empty .sname { color:var(--dim); font-weight:500; font-size:13px; }
.crown { font-size:10px; background:var(--gold); color:#2a1a05; border-radius:6px; padding:1px 5px; vertical-align:middle; }
.dots i { display:inline-block; width:7px; height:7px; margin:0 2px; border-radius:50%; background:var(--dim); animation:dot 1.2s infinite; }
.dots i:nth-child(2) { animation-delay:.2s; } .dots i:nth-child(3) { animation-delay:.4s; }
@keyframes dot { 0%,80%,100% { transform:translateY(0); opacity:.4; } 40% { transform:translateY(-6px); opacity:1; } }
.lobbymsg { color:var(--dim); font-size:14px; margin-top:16px; min-height:20px; }
.pulse { animation:glow 1.6s ease-in-out infinite; }

/* ================= GAME ================= */
#game { justify-content:space-between; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); overflow:hidden;
  background:radial-gradient(ellipse at 50% 46%, #19805b 0%, #0f5c43 42%, #072e21 78%, #03140d 100%); }
#game::before { content:""; position:absolute; inset:0; opacity:.16; mix-blend-mode:overlay; pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>"); }
#game::after { content:""; position:absolute; inset:7% 2.5%; border:2px solid rgba(246,200,95,.22); border-radius:50% / 22%; pointer-events:none; box-shadow:inset 0 0 80px rgba(0,0,0,.35); }
.topbar { position:relative; z-index:5; width:100%; max-width:720px; display:flex; justify-content:space-between; align-items:center; padding-right:48px; }
.roomtag { font-size:12px; letter-spacing:.16em; color:var(--dim); }
.roomtag b { color:var(--gold); font-size:15px; letter-spacing:.2em; }
.zone { position:relative; z-index:2; width:min(100%,680px); display:flex; flex-direction:column; align-items:center; gap:4px; }
#meZone { flex-direction:column-reverse; }
.pwrap { position:relative; }
.plate { display:flex; align-items:center; gap:10px; padding:5px 14px 5px 5px; border-radius:999px; background:rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.14); backdrop-filter:blur(4px); transition:box-shadow .3s, border-color .3s; }
.plate .avatar { width:34px; height:34px; font-size:16px; }
.plate .nm { font-weight:700; font-size:14px; }
.plate .rc { font-size:11px; color:#ffb4b4; margin-left:4px; }
.total { display:flex; align-items:baseline; gap:4px; padding:3px 11px; border-radius:999px; background:rgba(255,255,255,.1); font-size:11px; color:var(--dim); }
.total b { font:800 18px var(--serif); color:var(--ink); display:inline-block; min-width:1ch; text-align:center; }
.total.hid b::after { content:" + ?"; font-size:13px; opacity:.7; }
.total.over b { color:#ff7b7b; }
.bump b { animation:bump .5s var(--ease); }
@keyframes bump { 40% { transform:scale(1.5); color:var(--gold); } }
.plate.turn { border-color:var(--gold); animation:turnPulse 1.5s ease-in-out infinite; }
@keyframes turnPulse { 50% { box-shadow:0 0 0 4px rgba(246,200,95,.28), 0 0 28px rgba(246,200,95,.6); } 0%,100% { box-shadow:0 0 0 2px rgba(246,200,95,.5), 0 0 12px rgba(246,200,95,.3); } }
.bubble { position:absolute; left:calc(100% + 10px); top:50%; margin-top:-16px; padding:6px 14px; border-radius:14px; background:#fffef9; color:#222; font-weight:800; font-size:13px; opacity:0; white-space:nowrap; pointer-events:none; }
.bubble.pop { animation:bub 1.8s var(--ease) forwards; }
@keyframes bub { 0% { opacity:0; transform:scale(.4) translateX(-10px); } 12% { opacity:1; transform:scale(1.1); } 20% { transform:scale(1); } 80% { opacity:1; } 100% { opacity:0; transform:translateY(-10px); } }
.hand { position:relative; width:100%; height:calc(var(--ch) + 26px); }
.hand .pc { position:absolute; top:13px; transition:left .45s var(--ease), transform .45s var(--ease); }
.pc.secret .face { box-shadow:0 0 0 3px var(--gold), 0 0 22px rgba(246,200,95,.75); }
.pc.secret::after { content:"ONLY YOU"; position:absolute; top:-13px; left:50%; transform:translateX(-50%); font-size:9px; font-weight:800; letter-spacing:.1em; background:var(--gold); color:#2a1a05; padding:2px 7px; border-radius:6px; white-space:nowrap; z-index:50; }
.center { position:relative; z-index:3; width:min(100%,680px); display:flex; align-items:center; justify-content:center; gap:clamp(14px,5vw,40px); min-height:calc(var(--ch) + 34px); }
.result .btn { padding:9px 24px; font-size:14px; box-shadow:0 4px 0 #a8741a, 0 10px 18px rgba(0,0,0,.4); }
.result .rsub { margin:0 0 4px; }
.deck { position:relative; width:var(--cw); height:var(--ch); flex:none; }
.deck .layer { position:absolute; inset:0; }
.deck .layer .face { transform:none; backface-visibility:visible; }
.deck .dcount { position:absolute; left:50%; bottom:-12px; transform:translateX(-50%); z-index:10; background:rgba(0,0,0,.65); border:1px solid rgba(255,255,255,.2); color:var(--ink); font-weight:800; font-size:12px; padding:2px 10px; border-radius:999px; }
.deck.tick { animation:tick .35s; }
@keyframes tick { 40% { transform:translateY(-6px) rotate(-3deg); } }
.deck.empty .layer .face { opacity:.15; }
.mid { flex:1; max-width:340px; text-align:center; position:relative; min-height:80px; display:grid; place-items:center; }
.status { font:700 clamp(16px,4.4vw,20px) var(--serif); text-shadow:0 2px 10px rgba(0,0,0,.6); transition:opacity .3s; }
.status.you { color:var(--gold); animation:youIn .5s var(--ease); }
@keyframes youIn { from { transform:scale(.8); opacity:0; } }
.result { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; opacity:0; transform:scale(.5); pointer-events:none; }
.result.show { opacity:1; transform:none; pointer-events:auto; transition:transform .7s cubic-bezier(.3,1.5,.5,1), opacity .3s; }
.rtitle { font:900 clamp(28px,7.5vw,42px)/1 var(--serif); letter-spacing:.04em; }
.result.win .rtitle { background:linear-gradient(180deg,#fff1bd,#f6c85f 60%,#c9871a); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 4px 0 #7a4f08) drop-shadow(0 0 22px rgba(246,200,95,.6)); }
.result.lose .rtitle { color:#ff8d8d; text-shadow:0 3px 0 #5a1a1a; }
.result.draw .rtitle { color:#cfe3ff; text-shadow:0 3px 0 #1d3556; }
.rsub { font-size:14px; color:var(--ink); opacity:.9; margin-bottom:6px; }
.actions { position:relative; z-index:5; display:flex; gap:14px; justify-content:center; min-height:56px; padding-bottom:8px; opacity:0; transform:translateY(14px); pointer-events:none; transition:.4s var(--ease); }
.actions.on { opacity:1; transform:none; pointer-events:auto; }
.actions .btn.your { animation:glow 1.5s ease-in-out infinite; }
kbd { font:11px/1 monospace; opacity:.55; margin-left:8px; border:1px solid currentColor; border-radius:4px; padding:2px 4px; }
.small-only { display:none; }
#game .btn.big { padding:13px 30px; font-size:17px; }

/* ---------- misc overlays ---------- */
.toast { position:fixed; left:50%; top:18px; z-index:80; transform:translate(-50%,-80px); background:#fffef9; color:#222; padding:10px 20px; border-radius:999px; font-weight:700; font-size:14px; box-shadow:0 10px 30px rgba(0,0,0,.45); transition:transform .5s var(--ease); max-width:90vw; text-align:center; }
.toast.show { transform:translate(-50%,0); }
.conn { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); z-index:70; background:rgba(0,0,0,.75); padding:7px 16px; border-radius:999px; font-size:13px; display:flex; align-items:center; gap:8px; }
.conn::before { content:""; width:10px; height:10px; border-radius:50%; border:2px solid var(--gold); border-top-color:transparent; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.modal { position:fixed; inset:0; z-index:90; display:grid; place-items:center; background:rgba(0,0,0,.6); backdrop-filter:blur(4px); opacity:0; pointer-events:none; transition:opacity .25s; }
.modal.show { opacity:1; pointer-events:auto; }
.modal .box { background:#10281f; border:1px solid rgba(255,255,255,.15); border-radius:20px; padding:26px; width:min(380px,88vw); text-align:center; transform:scale(.9); transition:transform .3s var(--ease); }
.modal.show .box { transform:none; }
.modal p { margin:0 0 20px; font:700 19px var(--serif); }
.modal .row { display:flex; gap:12px; justify-content:center; }
#fx { position:fixed; inset:0; width:100%; height:100%; z-index:55; pointer-events:none; }
@media (prefers-reduced-motion: reduce) { .fl, .orb { animation:none; } }
</style>
</head>
<body>
<div id="app">
  <div class="bg"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div></div>

  <!-- PAGE 1: LANDING -->
  <section id="landing" class="page active">
    <div id="floaters"></div>
    <div class="stack">
      <div class="hero" id="hero">
        <div class="hc l"><div class="bob" id="hc1"></div></div>
        <div class="hc r"><div class="bob" id="hc2"></div></div>
        <div class="title">21</div>
      </div>
      <div class="tag">Get closer to 21 than your rival.<br>Go over and you bust.</div>
      <div class="steps">
        <div class="step on" id="s-play">
          <button class="btn shine" id="playBtn">▶&nbsp; PLAY</button>
        </div>
        <div class="step" id="s-name">
          <div class="q">What should we call you?</div>
          <input id="name" class="textin" maxlength="16" placeholder="Your name" autocomplete="off">
          <div class="err" id="nameErr"></div>
          <button class="btn" id="nameOk">CONTINUE</button>
        </div>
        <div class="step" id="s-mode">
          <div class="hello">Welcome, <b id="helloName"></b></div>
          <div class="modes">
            <button class="btn big shine" id="hostBtn">HOST</button>
            <button class="btn big ghost" id="joinBtn">JOIN</button>
          </div>
          <div class="err" id="menuErr"></div>
          <button class="linkbtn" id="changeName">Change name</button>
        </div>
      </div>
    </div>
  </section>

  <!-- PAGE 2: WAITING ROOM / ENTER CODE -->
  <section id="lobby" class="page">
    <div id="joinForm" class="panel">
      <div class="cap">Enter room code</div>
      <div class="digits" id="digits">

        <input class="digit" inputmode="numeric" maxlength="1" autocomplete="off">
        <input class="digit" inputmode="numeric" maxlength="1" autocomplete="off">
        <input class="digit" inputmode="numeric" maxlength="1" autocomplete="off">
        <input class="digit" inputmode="numeric" maxlength="1" autocomplete="off">

      <div class="err" id="joinErr"></div>

  <!-- PAGE 3: GAME -->
  <section id="game" class="page">

<button id="mute" title="Sound">🔊</button>
<div class="toast" id="toast"></div>
<div class="conn hide" id="conn">Reconnecting…</div>
<div class="modal" id="modal"><div class="box"><p id="modalText"></p><div class="row"><button class="btn" id="modalYes">Leave</button><button class="btn ghost" id="modalNo">Stay</button></div></div></div>
<canvas id="fx"></canvas>

<script>
const $ = (id) => document.getElementById(id);
const cid = sessionStorage.cid || (sessionStorage.cid = crypto.randomUUID());
const esc = (t) => { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
let ws = null, roomCode = null, state = null, retry = null, myName = (localStorage.name || "").trim();

/* ================= SOUND ================= */
let actx = null, muted = localStorage.muted === "1";
$("mute").textContent = muted ? "🔇" : "🔊";
$("mute").onclick = () => { muted = !muted; localStorage.muted = muted ? "1" : "0"; $("mute").textContent = muted ? "🔇" : "🔊"; ac(); };
function ac() {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch {}
  return actx;
}
function tone(f, t0, dur, type = "sine", vol = .12) {
  const a = ac(); if (!a || muted) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0;
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .05);
}
function noise(dur, freq, vol) {
  const a = ac(); if (!a || muted) return;
  const len = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = buf; f.type = "bandpass"; f.frequency.value = freq; g.gain.value = vol;
  s.connect(f).connect(g).connect(a.destination); s.start();
}
const sfx = {
  click: () => tone(520, 0, .08, "triangle", .1),
  deal: () => noise(.09, 2600, .35),
  flip: () => noise(.13, 1300, .3),
  turn: () => { tone(740, 0, .12, "sine", .08); tone(988, .09, .14, "sine", .08); },
  pass: () => tone(300, 0, .14, "triangle", .1),
  win: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * .11, .45, "triangle", .13)),
  lose: () => [392, 330, 262].forEach((f, i) => tone(f, i * .2, .5, "sawtooth", .06)),
};
document.addEventListener("click", (e) => { if (e.target.closest("button") && !e.target.closest("#mute")) sfx.click(); });

/* ================= SMALL UI HELPERS ================= */
let toastT;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2600);
}
function ask(text, yes = "Leave", no = "Stay") {
  return new Promise((res) => {
    $("modalText").textContent = text; $("modalYes").textContent = yes; $("modalNo").textContent = no;
    $("modal").classList.add("show");
    const done = (v) => { $("modal").classList.remove("show"); res(v); };
    $("modalYes").onclick = () => done(true); $("modalNo").onclick = () => done(false);
  });
}
function shake(el) { el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
const pages = ["landing", "lobby", "game"];
function show(id) { pages.forEach((p) => $(p).classList.toggle("active", p === id)); }

/* playing-card element (shared by landing + table) */
function makeCard(value, up = false) {
  const el = document.createElement("div");
  el.className = "pc" + (up ? " up" : "");
  el.innerHTML = `<div class="inner"><div class="face back"></div><div class="face front"><span class="cn tl"></span><span class="cn mid"></span><span class="cn br"></span></div></div>`;
  if (value != null) setFace(el, value);
  return el;
}
function setFace(el, v) {
  el.querySelectorAll(".cn").forEach((n) => (n.textContent = v));
  el.style.setProperty("--c", `hsl(${(v * 37 + 8) % 360} 55% 30%)`);
}

/* ================= LANDING ================= */
(function landingFx() {
  $("hc1").append(makeCard(10, true));
  $("hc2").append(makeCard(11, true));
  const layer = $("floaters");
  for (let i = 0; i < 16; i++) {
    const w = 34 + Math.random() * 56, fl = document.createElement("div");
    fl.className = "fl";
    const far = w < 56;
    fl.style.cssText = `left:${Math.random() * 96}%;--cw:${w}px;--d:${18 + Math.random() * 22}s;--dl:${-Math.random() * 30}s;--r0:${Math.random() * 120 - 60}deg;--r1:${Math.random() * 360 - 180}deg;--sw:${Math.random() * 120 - 60}px;--o:${far ? .28 : .5};--bl:${far ? 2 : 0}px`;
    fl.append(makeCard(1 + Math.floor(Math.random() * 11), Math.random() < .55));
    layer.append(fl);
  }
  const hero = $("hero");
  window.addEventListener("pointermove", (e) => {
    hero.style.setProperty("--mx", (e.clientX / innerWidth - .5).toFixed(3));
    hero.style.setProperty("--my", (e.clientY / innerHeight - .5).toFixed(3));
  });
})();

function step(id) {
  document.querySelectorAll(".step").forEach((s) => s.classList.toggle("on", s.id === id));
  if (id === "s-name") setTimeout(() => $("name").focus(), 350);
}
$("name").value = myName;
$("playBtn").onclick = () => { ac(); step("s-name"); };
function confirmName() {
  const n = $("name").value.trim();
  if (!n) { $("nameErr").textContent = "Please enter a name."; shake($("name")); return; }
  $("nameErr").textContent = "";
  myName = n; localStorage.name = n;
  $("helloName").textContent = n;
  step("s-mode");
}
$("nameOk").onclick = confirmName;
$("name").addEventListener("keydown", (e) => { if (e.key === "Enter") confirmName(); });
$("changeName").onclick = () => { $("menuErr").textContent = ""; step("s-name"); };

$("hostBtn").onclick = async () => {
  $("menuErr").textContent = "";
  const b = $("hostBtn"); b.disabled = true; b.textContent = "CREATING…";
  try {
    const res = await fetch("/api/host", { method: "POST" });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    showWait(data.code);
    connect(data.code);
  } catch (e) { $("menuErr").textContent = e.message || "Could not create room."; }
  b.disabled = false; b.textContent = "HOST";
};
$("joinBtn").onclick = () => { $("menuErr").textContent = ""; showJoinForm(); };

/* ================= LOBBY ================= */
const boxes = [...document.querySelectorAll(".digit")];
const codeValue = () => boxes.map((b) => b.value).join("");
function showJoinForm() {
  boxes.forEach((b) => (b.value = ""));
  $("joinErr").textContent = "";
  $("joinForm").classList.remove("hide"); $("waitBox").classList.add("hide");
  show("lobby");
  setTimeout(() => boxes[0].focus(), 400);
}
function fillDigits(str, from = 0) {
  const ds = str.replace(/\D/g, "");
  for (let i = 0; i < ds.length && from + i < 6; i++) boxes[from + i].value = ds[i];
  boxes[Math.min(from + ds.length, 5)].focus();
  if (codeValue().length === 6) tryJoin();
}
boxes.forEach((b, i) => {
  b.addEventListener("input", () => { if (b.value.length > 1) { const v = b.value; b.value = ""; fillDigits(v, i); return; } b.value = b.value.replace(/\D/g, ""); if (b.value && i < 5) boxes[i + 1].focus(); if (codeValue().length === 6) tryJoin(); });
  b.addEventListener("keydown", (e) => { if (e.key === "Backspace" && !b.value && i > 0) { boxes[i - 1].value = ""; boxes[i - 1].focus(); } if (e.key === "Enter") tryJoin(); });
  b.addEventListener("paste", (e) => { e.preventDefault(); fillDigits((e.clipboardData || window.clipboardData).getData("text"), 0); });
});
$("codeBack").onclick = () => { show("landing"); step("s-mode"); };
$("codeGo").onclick = () => tryJoin();
let joining = false;
async function tryJoin() {
  const code = codeValue();
  if (joining) return;
  if (code.length !== 6) { $("joinErr").textContent = "Enter all 6 digits."; shake($("digits")); return; }
  joining = true; $("joinErr").textContent = "";
  try {
    const res = await fetch("/api/room/" + code);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    connect(code);
  } catch (e) { $("joinErr").textContent = e.message || "Could not join."; shake($("digits")); }
  joining = false;
}

let tilesFor = null, seatKey = null;
function showWait(code) {
  roomCode = code;
  $("joinForm").classList.add("hide"); $("waitBox").classList.remove("hide");
  if (tilesFor !== code) { tilesFor = code; $("lobbyCode").innerHTML = [...code].map((d, i) => `<span class="tile" style="animation-delay:${i * 90}ms">${d}</span>`).join(""); }
  show("lobby");
}
$("codewrap").onclick = async () => {
  try { await navigator.clipboard.writeText(roomCode); toast("Room code copied"); } catch { toast("Room code: " + roomCode); }
};
function renderSeats(players, hostId, you) {
  const key = players.map((p) => p.id + p.name).join("|") + hostId;
  if (key === seatKey) return;
  seatKey = key;
  $("seats").innerHTML = [0, 1].map((i) => {
    const p = players[i];
    return p
      ? `<div class="seat in"><div class="avatar">${esc(p.name[0].toUpperCase())}</div><div class="sname">${esc(p.name)}${p.id === hostId ? ' <span class="crown">HOST</span>' : ""}${p.id === you ? " · you" : ""}</div></div>`
      : `<div class="seat empty"><div class="avatar ghostav"><span class="dots"><i></i><i></i><i></i></span></div><div class="sname">Waiting for player…</div></div>`;
  }).join("");
}
let lastCount = 0;
function renderLobby(s) {
  showWait(roomCode);
  renderSeats(s.players, s.hostId, s.you);
  if (s.players.length > lastCount && lastCount > 0) { sfx.turn(); }
  lastCount = s.players.length;
  const isHost = s.hostId === s.you, ready = s.players.length >= 2;
  $("startBtn").classList.toggle("hide", !isHost);
  $("startBtn").disabled = !ready;
  $("startBtn").classList.toggle("pulse", ready);
  $("lobbyMsg").textContent = !ready ? "Waiting for another player to join…" : isHost ? "Everyone's here — start when ready!" : "Waiting for the host to start…";
}
$("startBtn").onclick = () => send("start");
$("lobbyLeave").onclick = () => leave(true);

/* ================= CONNECTION ================= */
function connect(code) {
  roomCode = code;
  sessionStorage.room = code;
  clearTimeout(retry);
  if (ws) { ws.onclose = null; ws.close(); }
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const sock = (ws = new WebSocket(`${proto}://${location.host}/api/ws?code=${code}&cid=${encodeURIComponent(cid)}&name=${encodeURIComponent(myName || "Player")}`));
  sock.onopen = () => $("conn").classList.add("hide");
  sock.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === "state") { state = msg; render(); }
    else if (msg.type === "left") { leave(); toast(msg.message); }
    else if (msg.type === "error") {
      if (msg.fatal) { leave(); showJoinForm(); $("joinErr").textContent = msg.message; }
      else toast(msg.message);
    }
  };
  sock.onclose = () => {
    if (!roomCode || sock !== ws) return;
    $("conn").classList.remove("hide");
    retry = setTimeout(() => connect(roomCode), 1500);
  };
}
function send(type) { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type })); }

function leave(notify) {
  if (notify) send("leave");
  roomCode = null; state = null; tilesFor = null; seatKey = null; lastCount = 0;
  delete sessionStorage.room;
  clearTimeout(retry);
  if (ws) { ws.onclose = null; ws.close(); ws = null; }
  $("conn").classList.add("hide");
  resetGame();
  show("landing");
  if (myName) { $("helloName").textContent = myName; step("s-mode"); }
}
async function confirmLeave() {
  if (await ask("Leave the game? This ends it for both players.")) leave(true);
}
$("gameLeave").onclick = confirmLeave;

function render() {
  if (!state) return;
  if (state.phase === "lobby") renderLobby(state); else renderGame(state);
}

/* ================= GAME TABLE ================= */
let zones = {}, cardMap = new Map(), prevPhase = null, gen = 0, timers = [];
let lastN = null, lastTurn = null, deckShown = null, resultScheduled = false;
const DEAL_GAP = 260;

const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); return t; };

function resetGame() {
  timers.forEach(clearTimeout); timers = [];
  cardMap.forEach((c) => c.el.remove()); cardMap.clear();
  zones = {}; $("oppZone").innerHTML = ""; $("meZone").innerHTML = "";
  prevPhase = null; lastN = null; lastTurn = null; deckShown = null; resultScheduled = false;
  $("result").classList.remove("show", "win", "lose", "draw");
  $("status").style.opacity = 1;
  $("actions").classList.remove("on");
  $("deck").innerHTML = "";
}
function clearTable() {
  timers.forEach(clearTimeout); timers = [];
  cardMap.forEach((c) => c.el.remove()); cardMap.clear();
  resultScheduled = false;
  $("result").classList.remove("show", "win", "lose", "draw");
  $("status").style.opacity = 1;
  Object.values(zones).forEach((z) => { z.num.dataset.v = 0; z.num.textContent = 0; z.total.classList.remove("over"); });
}

function ensureZone(p, isMe) {
  if (!zones[p.id]) {
    const root = $(isMe ? "meZone" : "oppZone");
    root.innerHTML = `<div class="pwrap"><div class="plate"><div class="avatar">${esc(p.name[0].toUpperCase())}</div><span class="nm">${esc(p.name)}${isMe ? " (you)" : ""}</span><span class="rc"></span><div class="total"><span class="lbl"></span><b data-v="0">0</b></div></div><div class="bubble"></div></div><div class="hand"></div>`;
    zones[p.id] = {
      plate: root.querySelector(".plate"), total: root.querySelector(".total"), lbl: root.querySelector(".lbl"),
      num: root.querySelector(".total b"), bubble: root.querySelector(".bubble"), hand: root.querySelector(".hand"), rc: root.querySelector(".rc"),
    };
  }
  zones[p.id].rc.textContent = p.connected ? "" : "reconnecting…";
}

function layoutHand(pid) {
  const z = zones[pid]; if (!z) return;
  const list = [...cardMap.values()].filter((c) => c.pid === pid).sort((a, b) => a.slot - b.slot);
  if (!list.length) return;
  const W = z.hand.clientWidth, cw = list[0].el.offsetWidth, n = list.length;
  const stp = n > 1 ? Math.min(cw * .84, (W - cw - 10) / (n - 1)) : 0;
  const start = (W - (cw + stp * (n - 1))) / 2;
  list.forEach((c, i) => {
    const off = i - (n - 1) / 2;
    c.tf = `translateY(${(off * off * (n > 4 ? 1.1 : 2)).toFixed(1)}px) rotate(${(off * Math.min(4, 12 / Math.max(n - 1, 1))).toFixed(2)}deg)`;
    c.el.style.left = start + stp * i + "px";
    c.el.style.transform = c.tf;
    c.el.style.zIndex = i + 1;
  });
}
window.addEventListener("resize", () => Object.keys(zones).forEach(layoutHand));

function flipUp(c, ms) {
  later(() => { c.el.classList.add("up"); sfx.flip(); }, ms);
}

function addCard(p, slot, val, delay, isMe, finished) {
  const el = makeCard(val, false);
  const c = { el, pid: p.id, slot, known: val != null, tf: "" };
  if (slot === 0 && isMe && !finished) el.classList.add("secret");
  zones[p.id].hand.appendChild(el);
  cardMap.set(p.id + ":" + slot, c);
  layoutHand(p.id);
  const r = el.getBoundingClientRect(), d = $("deck").getBoundingClientRect();
  const dx = d.left + d.width / 2 - (r.left + r.width / 2), dy = d.top + d.height / 2 - (r.top + r.height / 2);
  el.animate(
    [{ transform: `translate(${dx}px, ${dy}px) rotate(-28deg) scale(.92)` }, { transform: c.tf }],
    { duration: 620, delay, easing: "cubic-bezier(.2,.9,.25,1)", fill: "backwards" }
  );
  later(sfx.deal, delay + 30);
  if (c.known) { c.scheduled = true; flipUp(c, delay + 540); }
  return c;
}

function setDeck(n) {
  const deck = $("deck");
  if (deckShown === n) return;
  const dec = deckShown != null && n < deckShown;
  deckShown = n;
  const layers = Math.min(n, 5);
  deck.innerHTML = Array.from({ length: layers }, (_, i) => `<div class="layer" style="transform:translate(${-i * 1.6}px,${-i * 1.6}px)"><div class="pc" style="width:100%;height:100%"><div class="face back"></div></div></div>`).join("") + `<div class="dcount">${n}</div>`;
  deck.classList.toggle("empty", n === 0);
  if (n === 0) deck.innerHTML = `<div class="layer"><div class="face back"></div></div><div class="dcount">0</div>`;
  if (dec) { deck.classList.remove("tick"); void deck.offsetWidth; deck.classList.add("tick"); }
}

function tween(z, to) {
  const from = +z.num.dataset.v || 0;
  z.num.dataset.v = to;
  if (from === to) { z.num.textContent = to; return; }
  const t0 = performance.now();
  (function f(t) { const k = Math.min(1, (t - t0) / 450); z.num.textContent = Math.round(from + (to - from) * k); if (k < 1) requestAnimationFrame(f); })(t0);
  z.total.classList.remove("bump"); void z.total.offsetWidth; z.total.classList.add("bump");
}

function bubble(pid, text) {
  const b = zones[pid]?.bubble; if (!b) return;
  b.textContent = text; b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop");
}

function renderGame(s) {
  show("game");
  $("gameCode").textContent = roomCode;
  const me = s.players.find((p) => p.id === s.you), opp = s.players.find((p) => p.id !== s.you);
  if (!me || !opp) return;

  const newRound = s.phase === "playing" && prevPhase !== "playing";
  if (newRound && prevPhase !== null) clearTable();
  const justFinished = s.phase === "finished" && prevPhase === "playing";
  prevPhase = s.phase;
  const myGen = ++gen;

  ensureZone(me, true); ensureZone(opp, false);

  // --- cards ---
  let created = 0;
  const finished = s.phase === "finished";
  const maxSlot = Math.max(me.visible.length, opp.visible.length);
  for (let slot = 0; slot <= maxSlot; slot++) {
    for (const p of [opp, me]) {
      if (slot > 0 && slot - 1 >= p.visible.length) continue;
      const val = slot === 0 ? p.hidden : p.visible[slot - 1];
      const key = p.id + ":" + slot;
      const c = cardMap.get(key);
      if (!c) { addCard(p, slot, val, created * DEAL_GAP, p === me, finished); created++; }
      else if (val != null && !c.known) { c.known = true; setFace(c.el, val); }
    }
  }
  const busy = created ? (created - 1) * DEAL_GAP + 1000 : 0;
  const revealAt = busy + 350;
  // flip any card whose face just became known (e.g. the rival's hidden card at the reveal)
  cardMap.forEach((c) => {
    if (c.known && !c.el.classList.contains("up") && !c.scheduled) {
      c.scheduled = true; flipUp(c, revealAt);
    }
    if (finished) c.el.classList.remove("secret");
  });
  Object.keys(zones).forEach(layoutHand);

  // --- deck ---
  later(() => { if (myGen === gen) setDeck(s.deckCount); }, created ? (created - 1) * DEAL_GAP : 0);

  // --- action bubbles ---
  const n = s.last?.n ?? 0;
  if (lastN === null) lastN = n;
  else if (n !== lastN) {
    lastN = n;
    if (s.last.type === "pass") { bubble(s.last.pid, "Pass"); sfx.pass(); } else bubble(s.last.pid, "Draw!");
  }

  // --- plates / totals / status / buttons ---
  const myTurn = s.phase === "playing" && s.turnId === s.you;
  later(() => {
    if (myGen !== gen) return;
    for (const p of [me, opp]) {
      const z = zones[p.id];
      z.plate.classList.toggle("turn", s.phase === "playing" && s.turnId === p.id);
      const isOpp = p === opp;
      z.lbl.textContent = isOpp && !finished ? "Showing" : "Total";
      z.total.classList.toggle("hid", isOpp && !finished && s.phase === "playing");
      const upd = () => { tween(z, p.total); z.total.classList.toggle("over", p.total > 21); };
      if (isOpp && justFinished) later(upd, revealAt - busy + 450); else upd();
    }
    const turnName = s.players.find((p) => p.id === s.turnId)?.name;
    const st = $("status");
    if (s.phase === "playing") {
      st.textContent = myTurn ? (s.passes > 0 ? `${opp.name} passed — draw, or pass to reveal` : "Your turn") : `${turnName}'s turn…`;
      st.classList.toggle("you", myTurn);
      st.style.opacity = 1;
      if (myTurn && lastTurn !== s.you) sfx.turn();
    } else if (!$("result").classList.contains("show")) {
      st.textContent = "Revealing cards…"; st.classList.remove("you");
    }
    lastTurn = s.turnId;
    $("actions").classList.toggle("on", s.phase === "playing");
    $("drawBtn").disabled = !myTurn || s.deckCount === 0;
    $("passBtn").disabled = !myTurn;
    $("drawBtn").classList.toggle("your", myTurn && s.deckCount > 0);
  }, busy);

  // --- result ---
  const isHost = s.hostId === s.you;
  $("againBtn").classList.toggle("hide", !isHost);
  $("waitHost").classList.toggle("hide", isHost);
  if (finished && !resultScheduled) {
    resultScheduled = true;
    later(showResult, revealAt + 1500);
  }
}

function showResult() {
  const s = state; if (!s || s.phase !== "finished") return;
  const w = s.result.winnerId, win = w === s.you, draw = w == null;
  const r = $("result");
  r.classList.remove("win", "lose", "draw");
  r.classList.add(draw ? "draw" : win ? "win" : "lose");
  $("rtitle").textContent = draw ? "DRAW" : win ? "YOU WIN!" : "YOU LOSE";
  $("rsub").textContent = s.result.reason;
  $("status").style.opacity = 0;
  r.classList.add("show");
  if (win) { sfx.win(); confetti(); } else if (!draw) sfx.lose(); else sfx.turn();
}

$("drawBtn").onclick = () => send("draw");
$("passBtn").onclick = () => send("pass");
$("againBtn").onclick = () => send("start");
document.addEventListener("keydown", (e) => {
  if (!$("game").classList.contains("active") || e.target.tagName === "INPUT") return;
  if (e.key === "d" || e.key === "D") { if (!$("drawBtn").disabled) send("draw"); }
  if (e.key === "p" || e.key === "P") { if (!$("passBtn").disabled) send("pass"); }
});

/* ================= CONFETTI ================= */
function confetti() {
  const cv = $("fx"), ctx = cv.getContext("2d"), dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const colors = ["#f6c85f", "#ffffff", "#3ddc97", "#ff6b6b", "#6aa8ff"];
  const ps = Array.from({ length: 160 }, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .55,
    vx: (Math.random() - .5) * 16, vy: -8 - Math.random() * 12, w: 6 + Math.random() * 6, h: 4 + Math.random() * 5,
    r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: colors[(Math.random() * colors.length) | 0],
  }));
  const t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    const age = t - t0;
    for (const p of ps) {
      p.vy += .32; p.vx *= .992; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.max(0, 1 - age / 3600);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    }
    if (age < 3600) requestAnimationFrame(frame); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })(t0);
}

/* ================= BOOT ================= */
if (sessionStorage.room && myName) {
  $("helloName").textContent = myName;
  $("app").classList.add("boot"); // no page crossfade on refresh
  show("game");
  connect(sessionStorage.room);
  setTimeout(() => $("app").classList.remove("boot"), 100);
}
</script>
